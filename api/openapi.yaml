openapi: 3.0.3
info:
  title: Awesome Notes API
  version: 1.0.0
  description: |
    REST API for the Awesome Notes app.

    Users register, log in and manage their own notes. Every note operation
    is scoped to the authenticated user: a note that belongs to someone else
    is reported as not found.

    Note ids are UUIDs generated by the client, so a note created offline has
    the same id locally and on the server.
servers:
  - url: http://localhost:8080
    description: Local (Docker Compose)
tags:
  - name: System
    description: Service status
  - name: Auth
    description: Registration and session management
  - name: Notes
    description: Notes of the authenticated user
security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [System]
      summary: Check that the service is running
      operationId: health
      security: []
      responses:
        '200':
          description: The service is running.

  /auth/register:
    post:
      tags: [Auth]
      summary: Create an account
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
      responses:
        '201':
          description: Account created. Log in to get a session token.
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: The username is already taken.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: USERNAME_TAKEN
                message: This username is already taken.

  /auth/login:
    post:
      tags: [Auth]
      summary: Log in and receive a session token
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
      responses:
        '200':
          description: Logged in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Wrong username or password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INVALID_CREDENTIALS
                message: Wrong username or password.

  /auth/logout:
    post:
      tags: [Auth]
      summary: End the current session
      description: Revokes the token sent in the Authorization header.
      operationId: logout
      responses:
        '204':
          description: Session ended.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /notes:
    get:
      tags: [Notes]
      summary: List the user's notes
      description: Returns every note of the authenticated user, most recently updated first.
      operationId: listNotes
      responses:
        '200':
          description: The user's notes.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Note'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Notes]
      summary: Create a note
      description: |
        The client generates the note id (a UUID).

        Safe to retry: if a note with this id already exists for the same
        user, nothing is changed and the existing note is returned with 200.
      operationId: createNote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewNote'
      responses:
        '201':
          description: Note created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
        '200':
          description: A note with this id already existed for this user and is returned unchanged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: The id is already used by another user's note. The client should generate a new id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: NOTE_ID_CONFLICT
                message: This note id cannot be used.

  /notes/{id}:
    parameters:
      - $ref: '#/components/parameters/NoteId'
    put:
      tags: [Notes]
      summary: Update a note
      description: Replaces the title and content of the note.
      operationId: updateNote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoteInput'
      responses:
        '200':
          description: Note updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Notes]
      summary: Delete a note
      description: |
        Returns 404 if the note does not exist, or belongs to another user.
        A client retrying a delete can treat 404 as success.
      operationId: deleteNote
      responses:
        '204':
          description: Note deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Opaque session token returned by `POST /auth/login`.

  parameters:
    NoteId:
      name: id
      in: path
      required: true
      description: The note id (a UUID generated by the client).
      schema:
        type: string
        format: uuid

  schemas:
    Credentials:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 50
          example: maria
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          example: s3cretpass

    LoginResponse:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: 'Send it as `Authorization: Bearer <token>`.'
          example: 9f2c4e1b7a6d4f0e8c3b5a2d1e7f6c4b

    NoteInput:
      type: object
      required: [title, content]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
          example: Shopping list
        content:
          type: string
          maxLength: 10000
          example: Milk, eggs, bread

    NewNote:
      allOf:
        - type: object
          required: [id]
          properties:
            id:
              type: string
              format: uuid
              description: Generated by the client.
              example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        - $ref: '#/components/schemas/NoteInput'

    Note:
      type: object
      required: [id, title, content, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        title:
          type: string
          example: Shopping list
        content:
          type: string
          example: Milk, eggs, bread
        createdAt:
          type: string
          format: date-time
          example: '2026-11-17T10:15:30Z'
        updatedAt:
          type: string
          format: date-time
          example: '2026-11-17T10:20:00Z'

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable, machine-readable error code.
          enum:
            - VALIDATION_ERROR
            - USERNAME_TAKEN
            - INVALID_CREDENTIALS
            - UNAUTHORIZED
            - NOT_FOUND
            - NOTE_ID_CONFLICT
          example: VALIDATION_ERROR
        message:
          type: string
          description: Human-readable explanation, in English.
          example: Title must be between 1 and 255 characters.

  responses:
    BadRequest:
      description: The request body is invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: VALIDATION_ERROR
            message: Title must be between 1 and 255 characters.
    Unauthorized:
      description: The token is missing, invalid or revoked.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: UNAUTHORIZED
            message: Authentication required.
    NotFound:
      description: The note does not exist, or belongs to another user.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: NOT_FOUND
            message: Note not found.